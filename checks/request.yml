# Live check request. Started by hand: Actions, "checks", Run workflow
# (workflow_dispatch). Results are committed to checks/results/<id>/.
id: recon-004
check: catalog
purpose: >-
  Stage 2 for the skincare retailers: the 3 that passed recon-003 get their whole
  catalog and 4 random GTIN probes; all 13 get product .js probes on overlap
  candidates drawn from the recon-002 catalogs at random within score bands
  0.5-0.6, 0.6-0.7, 0.7-0.8 and 0.8+, so the precision of each cut-off can be
  checked against GTINs (D-002). At most 18 named probes per retailer.
candidates: checks/candidates.yml
only:
  - ayla-beauty
  - cos-bar
  - credo-beauty
  - dermsilk
  - integrity-botanicals
