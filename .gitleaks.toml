title = "cross-store-price-comparison"

[extend]
useDefault = true

[[allowlists]]
description = "The product_key of a match without a barcode: M and 13 hex digits of a SHA-256 (crossprice.match). The name product_key and that hash read as a generic API key."
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^M[0-9a-f]{13}$''']
